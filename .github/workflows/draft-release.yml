name: Staging Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Choose the Python version for a manual build'
        required: true
        default: 'default'
        type: choice
        options:
          - 'default'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'

env:
  DEFAULT_PYTHON_VERSION: '3.14'


jobs:
  tests:
    name: Tests (matrix)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install .[test] build

      - name: Run unit tests
        run: |
          pytest tests/test_smsru.py

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python (build)
        uses: actions/setup-python@v7
        with:
          python-version: >-
            ${{ 
              (inputs.python_version == '' || inputs.python_version == 'default') 
              && env.DEFAULT_PYTHON_VERSION 
              || inputs.python_version 
            }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine setuptools_scm

      - name: Build distributions
        run: |
          python -m build

      - name: Validate distributions
        run: |
          python -m twine check dist/*

      - name: Verify tag matches built version
        run: |
          python - <<'PY'
          import glob
          import pathlib
          import sys

          tag = "${{ github.ref_name }}"
          expected = tag[1:] if tag.startswith("v") else tag
          wheel = pathlib.Path(glob.glob("dist/*.whl")[0]).name
          parts = wheel[:-4].split("-")
          if len(parts) < 2:
              raise SystemExit(f"Unexpected wheel filename: {wheel}")
          actual = parts[1]
          if actual != expected:
              raise SystemExit(f"Tag version {expected!r} does not match wheel version {actual!r}")
          print(f"Verified version {actual} from {wheel}")
          PY

      - name: Smoke test wheel install in clean environment
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python - <<'PY'
          import smsru_api
          from smsru_api import AsyncClient, Client

          assert smsru_api is not None
          assert Client is not None
          assert AsyncClient is not None
          print("Smoke import passed")
          PY

      - name: Upload artifact (dist) for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/*
  
  publish-test-pypi:
    name: Publish to Test PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: testpypi
    outputs:
      testpypi-version: ${{ steps.testpypi-version.outputs.version }}
    
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      
      - name: Set up Python (publish)
        uses: actions/setup-python@v7
      
      - name: Install publish tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "packaging>=24.2" build twine setuptools_scm

      - name: Compute TestPyPI version
        id: testpypi-version
        run: |
          echo "version=${GITHUB_REF_NAME#v}.dev${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Build TestPyPI distributions
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.testpypi-version.outputs.version }}
        run: |
          python -m build --outdir dist-testpypi

      - name: Validate TestPyPI distributions
        run: |
          python -m twine check dist-testpypi/*

      - name: Publish to Test PyPI
        run: |
          python -m twine upload --verbose --non-interactive --skip-existing --repository-url https://test.pypi.org/legacy/ dist-testpypi/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  test-test-pypi:
    name: Install from Test PyPI
    runs-on: ubuntu-latest
    needs: publish-test-pypi

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: >-
            ${{ 
              (inputs.python_version == '' || inputs.python_version == 'default') 
              && env.DEFAULT_PYTHON_VERSION 
              || inputs.python_version 
            }}

      - name: Install runtime dependencies from PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx

      - name: Install published package from Test PyPI
        env:
          TESTPYPI_VERSION: ${{ needs.publish-test-pypi.outputs.testpypi-version }}
        run: |
          for attempt in {1..8}; do
            if python -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --no-cache-dir \
              --no-deps \
              "smsru_api==${TESTPYPI_VERSION}"; then
              break
            fi

            if [ "$attempt" -eq 8 ]; then
              echo "TestPyPI package smsru_api==${TESTPYPI_VERSION} was not installable after 8 attempts" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Verify installed package imports
        run: |
          python - <<'PY'
          import smsru_api
          from smsru_api import AsyncClient, Client

          assert smsru_api is not None
          assert Client is not None
          assert AsyncClient is not None
          print("TestPyPI install smoke test passed")
          PY

  draft-release:
    name: Create draft release with assets
    runs-on: ubuntu-latest
    needs: [publish-test-pypi, test-test-pypi]

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Download artifact (dist) for inspection
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist

      - name: Set release metadata
        id: release-meta
        run: |
          current_tag="${GITHUB_REF_NAME}"
          previous_tag="$(git tag --sort=-version:refname | grep -Fxv "${current_tag}" | head -n 1)"

          if [[ "${{ github.ref_name }}" =~ (alpha|beta|rc) ]]; then
            echo "release_state=pre" >> "$GITHUB_OUTPUT"
          else
            echo "release_state=stable" >> "$GITHUB_OUTPUT"
          fi
          echo "release_version=${current_tag#v}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"
          if [[ -n "${previous_tag}" ]]; then
            echo "compare_url=https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${current_tag}" >> "$GITHUB_OUTPUT"
          else
            echo "compare_url=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${current_tag}" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Create (or update) draft release for this tag
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ steps.release-meta.outputs.release_state == 'pre' }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          body: |
            # Установка

            ```bash
            pip install smsru-api==${{ steps.release-meta.outputs.release_version }}
            ```

            ## Добавлено

            - 

            ## Изменено

            - 

            ## Исправлено

            - 

            ## Что учесть при обновлении

            - 

            > В changelog включаем только изменения, влияющие на пользовательский опыт.
            > Не перечисляем CI, workflow, release pipeline, внутренние refactor-правки и прочую техническую кухню, если они не меняют поведение библиотеки для пользователя.

            **TestPyPI**: https://test.pypi.org/project/smsru-api/${{ needs.publish-test-pypi.outputs.testpypi-version }}/
            **Full Changelog**: ${{ steps.release-meta.outputs.compare_url }}
